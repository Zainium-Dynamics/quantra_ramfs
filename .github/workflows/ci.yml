name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the musl target
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --target x86_64-unknown-linux-musl -- -D warnings
      - name: Test
        run: cargo test --target x86_64-unknown-linux-musl
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: quantra-ramfs
          path: target/x86_64-unknown-linux-musl/release/quantra-ramfs
